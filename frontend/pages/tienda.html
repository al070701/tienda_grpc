<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Tienda</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/styles.css">

<style>
.card img{
height:200px;
object-fit:cover;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4">

<span class="navbar-brand">🛍 Tienda gRPC</span>

<div>
<button class="btn btn-outline-light me-2" onclick="irCarrito()">🛒</button>
<button class="btn btn-outline-light me-2" onclick="irHistorial()">🧾</button>
<button class="btn btn-outline-light" onclick="logout()">Salir</button>
</div>

</nav>


<div class="container mt-4">

<div class="row" id="productos-container"></div>

</div>


<!-- MODAL VER MÁS -->

<div class="modal fade" id="modalProducto" tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title" id="modalTitulo"></h5>

<button class="btn-close" data-bs-dismiss="modal"></button>

</div>

<div class="modal-body text-center">

<img id="modalImagen" class="img-fluid mb-3">

<p id="modalPrecio"></p>

<p>Producto disponible en nuestra tienda.</p>

</div>

</div>
</div>
</div>


<!-- LIBRERÍAS JS -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="../js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
