<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Tienda gRPC</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-gradient">

<div class="login-container">
  <div class="card shadow-lg p-4">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>

    <input type="text" id="usuario" class="form-control mb-3" placeholder="Usuario">
    <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">

    <button class="btn btn-dark w-100" onclick="login()">Entrar</button>
  </div>
</div>

<script src="../js/app.js"></script>
</body>
</html>
