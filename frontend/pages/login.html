<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Tienda gRPC</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="bg-gradient">

<div class="login-container">
  <div class="card shadow-lg p-4">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>
    
    <input type="email" 
    id="correo"
    class="form-control mb-3"
    placeholder="Correo">
    <input 
    type="password" 
    id="password"
    maxlength="8"
    class="form-control mb-3" placeholder="Contraseña">

    <button class="btn btn-dark w-100" onclick="login()">Entrar</button>

    <div class="d-grid gap-2 mt-3">
      <button class="btn btn-success"
      onclick="registrar()"> Crear cuenta</button>
    </div>
  </div>

  <p class="text-center mt-3">
    <a href="#"
    onclick="recuperarPassword()"> ¿Olvidaste tu contraseña?
  </a>
  </p>

  <button class="btn btn-danger w-100 mt-2"
  onclick="loginGoogle()"> Entrar con Google
  </button>

  <main class="flex-1 p-10">
    <div class="flex justify-end mb-6">
     <button onclick="volverAnterior()" class="w-12 h-12 rounded-full bg-white shadow-md text-2xl hover:bg-red-500 hover:text-white transition">
      Volver
      </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module"
src="../js/login.js"></script>
<script type="module" src="../js/app.js" >

</script>

</body>
</html>
