<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Tienda gRPC</title>

  <link rel="icon" type="image/x-icon" href="../assets/logo_azul.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=DynaPuff:wght@400..700&family=Viga&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/styles.css">

  <style>
      .font-cherry { font-family: 'Cherry Bomb One', cursive; }
      .font-viga { font-family: 'Viga', sans-serif; }   
      .font-dynapuff { font-family: 'DynaPuff', cursive; }
      .highlight-word { color: #d26ae6; }
      .text-justify { text-align: justify; text-align-last: justify; }
  </style>

</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br bg-[#fcd3fe] px-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-orange-100 font-viga">

    <!-- Encabezado -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold font-dynapuff text-[#d26ae6] mb-2">
        Iniciar Sesión
      </h1>
      <p class="text-gray-400 text-sm">
        Bienvenido de nuevo a Rellenitos
      </p>
    </div>

    <!-- Inputs -->
    <div class="space-y-4">
      <div>
        <label for="correo" class="block text-lg font-semibold font-dynapuff text-[#d26ae6] mb-1">
          Correo electrónico
        </label>
        <input
          type="email"
          id="correo"
          placeholder="ejemplo@correo.com"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#d26ae6] focus:border-transparent transition"
        >
      </div>

      <div>
        <label for="password" class="block text-lg font-semibold font-dynapuff text-[#d26ae6] mb-1">
          Contraseña
        </label>
        <input
          type="password"
          id="password"
          placeholder="Tu contraseña"
          class="w-full px-4 py-3 rounded-xl border border-gray-300 text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#d26ae6] focus:border-transparent transition"
        >
      </div>
    </div>

    <!-- Botones principales -->
    <div class="mt-6 space-y-3">
      <button
        type="button"
        onclick="login()"
        class="w-full py-3 rounded-xl bg-[#5ee1e6] text-white font-semibold shadow-md hover:bg-[#7aedf1] active:scale-[0.98] transition">
        Entrar
      </button>

      <button
        type="button"
        onclick="registrar()"
        class="w-full py-3 rounded-xl bg-white text-[#5ee1e6] font-semibold border border-[#5ee1e6] hover:bg-gray-100 active:scale-[0.98] transition">
        Crear cuenta
      </button>
    </div>

    <!-- Recuperar contraseña -->
    <div class="text-center mt-5">
      <button
        type="button"
        onclick="recuperarPassword()"
        class="text-sm text-[#d26ae6] hover:text-[#5ee1e6] hover:underline transition">
        ¿Olvidaste tu contraseña?
      </button>
    </div>

    <!-- Volver -->
    <button
      type="button"
      onclick="volverAnterior()"
      class="w-full mt-4 py-3 rounded-xl bg-[#d26ae6] text-white font-semibold border border-[#d26ae6] hover:bg-[#c059d0] active:scale-[0.98] transition">
      Volver
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="../js/login.js"></script>

</body>
</html>
