<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Historial de Compras</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>Historial de Compras</h2>

<button class="btn btn-dark" onclick="volverTienda()">
⬅ Volver a tienda
</button>

</div>

<div class="row">

<div class="col-md-6">
<h4 class="text-warning">Pendientes</h4>
<div id="pendientes"></div>
</div>

<div class="col-md-6">
<h4 class="text-success">Entregados</h4>
<div id="entregados"></div>
</div>

</div>
</div>

<script>

const API = window.location.origin;
const usuario = localStorage.getItem("usuario");

let mapaProductos = {};


/* =========================
VOLVER A TIENDA
========================= */

function volverTienda(){
window.location.href = "tienda.html";
}


/* =========================
CARGAR PRODUCTOS (MAPA)
========================= */

async function cargarMapaProductos(){

let res = await fetch(API + "/productos");
let productos = await res.json();

mapaProductos = {};

productos.forEach(p=>{
mapaProductos[p.id] = p.nombre;
});

}


/* =========================
CARGAR HISTORIAL
========================= */

async function cargarHistorial(){

await cargarMapaProductos();

let res = await fetch(API + "/historial/" + usuario);
let data = await res.json();

const pendientes = document.getElementById("pendientes");
const entregados = document.getElementById("entregados");

pendientes.innerHTML="";
entregados.innerHTML="";


/* ======================
PENDIENTES
====================== */

data.pendientes.forEach(p=>{

pendientes.innerHTML += `
<div class="card mb-3 shadow-sm border-warning">
<div class="card-body">

<h6>${mapaProductos[p.producto_id] || "Producto eliminado"}</h6>

<span class="badge bg-warning text-dark">
Pendiente
</span>

<p class="mt-2">
Cantidad: ${p.cantidad}<br>
Fecha: ${p.fecha}
</p>

</div>
</div>
`;

});


/* ======================
ENTREGADOS
====================== */

data.entregados.forEach(p=>{

entregados.innerHTML += `
<div class="card mb-3 shadow-sm border-success">
<div class="card-body">

<h6>${mapaProductos[p.producto_id] || "Producto eliminado"}</h6>

<span class="badge bg-success">
Entregado
</span>

<p class="mt-2">
Cantidad: ${p.cantidad}<br>
Fecha: ${p.fecha}
</p>

</div>
</div>
`;

});

}


/* =========================
AUTO RECARGA
========================= */

cargarHistorial();

setInterval(() => {

cargarHistorial();

}, 3000);

</script>

</body>
</html>
