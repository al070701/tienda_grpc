apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventario
  template:
    metadata:
      labels:
        app: inventario
    spec:
      containers:
        - name: inventario
          image: tienda-grpc:local
          imagePullPolicy: IfNotPresent
          command: ["python", "inventario/servidor_inventario.py"]
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: inventario
spec:
  selector:
    app: inventario
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
